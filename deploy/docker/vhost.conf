<VirtualHost *:80>
	DocumentRoot /var/www/html

	# ENVIRONMENT dibaca index.php lewat $_SERVER['CI_ENV']
	SetEnv CI_ENV production

	<Directory /var/www/html>
		Options -Indexes +FollowSymLinks
		AllowOverride All
		Require all granted
	</Directory>

	# Folder yang tidak boleh diakses langsung dari web
	<DirectoryMatch "^/var/www/html/(system|application)/">
		Require all denied
	</DirectoryMatch>

	<FilesMatch "\.(sql|md|rst|json|lock|bak|pem|ini)$">
		Require all denied
	</FilesMatch>

	Header always set X-Content-Type-Options "nosniff"
	Header always set X-Frame-Options "SAMEORIGIN"
	Header always set Referrer-Policy "same-origin"

	ErrorLog /var/log/apache2/lispro-error.log
	CustomLog /var/log/apache2/lispro-access.log combined
</VirtualHost>

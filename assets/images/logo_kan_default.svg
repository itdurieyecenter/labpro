<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="kanRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>
    <linearGradient id="kanBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
  </defs>

  <!-- Outer Rounded Shield -->
  <rect x="12" y="12" width="176" height="176" rx="24" fill="#ffffff" stroke="#cbd5e1" stroke-width="2.5" />
  <rect x="18" y="18" width="164" height="164" rx="20" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" />

  <!-- Top Blue Accent Header -->
  <path d="M 18 38 C 18 26.95 26.95 18 38 18 L 162 18 C 173.05 18 182 26.95 182 38 L 182 52 L 18 52 Z" fill="url(#kanBorder)" />
  <text x="100" y="38" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1.5">TERAKREDITASI</text>

  <!-- KAN Center Badge -->
  <g transform="translate(100, 88)">
    <!-- Red diamond shield -->
    <rect x="-38" y="-24" width="76" height="48" rx="8" fill="url(#kanRed)" />
    <!-- Big KAN Letters -->
    <text x="0" y="11" font-family="'Segoe UI', Roboto, Helvetica, sans-serif" font-size="28" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="2">KAN</text>
  </g>

  <!-- Accreditation Details -->
  <text x="100" y="132" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="800" fill="#0f172a" text-anchor="middle" letter-spacing="0.5">Komite Akreditasi Nasional</text>
  <text x="100" y="146" font-family="'Segoe UI', Roboto, monospace" font-size="9" font-weight="700" fill="#0369a1" text-anchor="middle">LP-891-IDN</text>
  <text x="100" y="162" font-family="'Segoe UI', Roboto, monospace" font-size="8.5" font-weight="800" fill="#b91c1c" text-anchor="middle" letter-spacing="0.5">ISO/IEC 17025 : 2017</text>
</svg>

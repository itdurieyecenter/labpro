<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="emeraldBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="50%" stop-color="#047857" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <filter id="dropGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#022c22" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Outer Golden Gear / Shield Border -->
  <circle cx="100" cy="100" r="92" fill="url(#emeraldBg)" stroke="url(#goldAccent)" stroke-width="4.5" filter="url(#dropGlow)" />
  <circle cx="100" cy="100" r="82" fill="none" stroke="#fef08a" stroke-width="1.2" stroke-dasharray="3,3" opacity="0.8" />

  <!-- Inner Decorative Ring -->
  <circle cx="100" cy="100" r="76" fill="#064e3b" stroke="url(#goldAccent)" stroke-width="2" />

  <!-- Laboratory Flask & Medical Symbolism -->
  <g transform="translate(100, 96)">
    <!-- Flask Body -->
    <path d="M -12 -38 L 12 -38 L 12 -24 L 32 20 C 36 29 28 38 18 38 L -18 38 C -28 38 -36 29 -32 20 L -12 -24 Z" 
          fill="#ffffff" stroke="url(#goldAccent)" stroke-width="2.5" stroke-linejoin="round" />
    
    <!-- Flask Lip -->
    <rect x="-16" y="-42" width="32" height="6" rx="2" fill="url(#goldAccent)" />
    
    <!-- Fluid inside Flask (Emerald & Bubbles) -->
    <path d="M -24 8 Q -10 2 0 8 T 24 8 L 29 18 C 31 23 27 34 18 34 L -18 34 C -27 34 -31 23 -29 18 Z" 
          fill="url(#emeraldBg)" opacity="0.9" />
    
    <!-- Bubbles -->
    <circle cx="-6" cy="20" r="2.5" fill="#fef08a" opacity="0.9" />
    <circle cx="8" cy="15" r="3.5" fill="#fef08a" opacity="0.9" />
    <circle cx="-1" cy="26" r="2" fill="#ffffff" opacity="0.8" />

    <!-- Medical Plus Symbol inside flask -->
    <path d="M -4 -8 L 4 -8 L 4 -16 L -4 -16 Z M -10 -12 L 10 -12 L 10 -10 L -10 -10 Z" fill="url(#goldAccent)" />
  </g>

  <!-- Golden Stars (Excellence) -->
  <g fill="url(#goldAccent)">
    <!-- 5 Stars representing Pancasila & Standar Mutu -->
    <polygon points="100,24 102,28 107,28 103,31 105,35 100,32 95,35 97,31 93,28 98,28" />
    <polygon points="76,30 78,34 83,34 79,37 81,41 76,38 71,41 73,37 69,34 74,34" />
    <polygon points="124,30 126,34 131,34 127,37 129,41 124,38 119,41 121,37 117,34 122,34" />
  </g>

  <!-- Typography Arc / Labkes text -->
  <text x="100" y="156" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="900" fill="#fef08a" text-anchor="middle" letter-spacing="1.5">LABKES PROVINSI</text>
  <text x="100" y="169" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="2">RIAU</text>
</svg>
